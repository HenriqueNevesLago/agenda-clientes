<h2>{{ isEditing ? 'Atualizar agendamento' : 'Novo agendamento' }}</h2>

<form (ngSubmit)="save.emit()" class="form-grid">
  <label>
    Nome (opcional)
    <input
      type="text"
      name="name"
      [(ngModel)]="model.name"
      placeholder="Ex.: Maria Souza"
      autocomplete="name"
      enterkeyhint="next"
    />
  </label>

  <label>
    Celular (opcional)
    <input
      type="tel"
      name="phone"
      [ngModel]="model.phone"
      (ngModelChange)="onPhoneInput($event)"
      placeholder="(11) 91234-5678"
      autocomplete="tel-national"
      inputmode="numeric"
      enterkeyhint="next"
    />
  </label>

  <label>
    Carro (opcional)
    <input
      type="text"
      name="car"
      [(ngModel)]="model.car"
      placeholder="Ex.: Civic EXL 2021"
      autocomplete="off"
      enterkeyhint="next"
    />
  </label>

  <label>
    Nota (opcional)
    <textarea
      name="note"
      [(ngModel)]="model.note"
      placeholder="Observações do atendimento"
      rows="3"
      maxlength="300"
      enterkeyhint="done"
    ></textarea>
  </label>

  <label>
    Tipo de serviço
    <span class="service-select-row">
      <select name="serviceType" [(ngModel)]="model.serviceType" required>
        @for (service of serviceOptions; track service) {
          <option [value]="service">{{ service }}</option>
        }
      </select>
      <button
        type="button"
        class="service-plus"
        (click)="openServiceTypeEditor()"
        aria-label="Adicionar novo tipo de serviço"
      >
        +
      </button>
    </span>
  </label>

  @if (isAddingServiceType) {
    <div class="service-editor">
      <input
        type="text"
        name="newServiceType"
        [(ngModel)]="newServiceTypeName"
        placeholder="Novo tipo de serviço"
      />
      <div class="service-editor-actions">
        <button type="button" class="ghost" (click)="confirmServiceType()">Adicionar</button>
        <button type="button" class="ghost" (click)="cancelServiceTypeEditor()">Cancelar</button>
      </div>
    </div>
  }

  <label>
    Data e hora
    <span class="date-time-row">
      <input
        type="date"
        name="datePart"
        [ngModel]="datePart"
        (ngModelChange)="onDatePartChange($event)"
        required
      />
      <select
        name="timePart"
        [ngModel]="timePart"
        (ngModelChange)="onTimePartChange($event)"
        required
      >
        <option value="">Selecione o horário</option>
        @for (slot of timeSlots; track slot) {
          <option [value]="slot">{{ slot }}</option>
        }
      </select>
    </span>
  </label>

  @if (formError) {
    <p class="error">{{ formError }}</p>
  }

  <div class="actions">
    <button class="primary" type="submit" [disabled]="isSaving">
      {{ isSaving ? (isEditing ? 'Salvando...' : 'Agendando...') : (isEditing ? 'Salvar alteração' : 'Agendar horário') }}
    </button>
    @if (isEditing) {
      <button type="button" class="ghost" (click)="reset.emit()" [disabled]="isSaving">
        Limpar
      </button>
    }
  </div>
</form>
